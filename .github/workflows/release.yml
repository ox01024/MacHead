name: Build and Release OTA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史以生成 Technical Release Notes

      - name: Fetch and Merge Latest Nezha & ServerStatus Binaries 📥
        run: |
          mkdir -p Resources
          TEMP_DIR="temp_binaries"
          mkdir -p "${TEMP_DIR}"
          
          echo "Determining latest Nezha Agent version..."
          NEZHA_VER=$(curl -sI https://github.com/nezhahq/agent/releases/latest | grep -i location | awk -F'/' '{print $NF}' | tr -d '\r\n')
          echo "Latest Nezha Version: ${NEZHA_VER}"
          
          curl -L -o "${TEMP_DIR}/nezha_amd64.zip" "https://github.com/nezhahq/agent/releases/download/${NEZHA_VER}/nezha-agent_darwin_amd64.zip"
          curl -L -o "${TEMP_DIR}/nezha_arm64.zip" "https://github.com/nezhahq/agent/releases/download/${NEZHA_VER}/nezha-agent_darwin_arm64.zip"
          
          unzip -o "${TEMP_DIR}/nezha_amd64.zip" -d "${TEMP_DIR}/nezha_amd64"
          unzip -o "${TEMP_DIR}/nezha_arm64.zip" -d "${TEMP_DIR}/nezha_arm64"
          
          lipo -create \
            "${TEMP_DIR}/nezha_amd64/nezha-agent" \
            "${TEMP_DIR}/nezha_arm64/nezha-agent" \
            -output Resources/nezha-agent
          
          echo "Determining latest ServerStatus-Rust version..."
          STATUS_VER=$(curl -sI https://github.com/zdz/ServerStatus-Rust/releases/latest | grep -i location | awk -F'/' '{print $NF}' | tr -d '\r\n')
          echo "Latest ServerStatus Version: ${STATUS_VER}"
          
          curl -L -o "${TEMP_DIR}/status_amd64.zip" "https://github.com/zdz/ServerStatus-Rust/releases/download/${STATUS_VER}/client-x86_64-apple-darwin.zip"
          curl -L -o "${TEMP_DIR}/status_arm64.zip" "https://github.com/zdz/ServerStatus-Rust/releases/download/${STATUS_VER}/client-aarch64-apple-darwin.zip"
          
          unzip -o "${TEMP_DIR}/status_amd64.zip" -d "${TEMP_DIR}/status_amd64"
          unzip -o "${TEMP_DIR}/status_arm64.zip" -d "${TEMP_DIR}/status_arm64"
          
          lipo -create \
            "${TEMP_DIR}/status_amd64/stat_client" \
            "${TEMP_DIR}/status_arm64/stat_client" \
            -output Resources/serverstatus-client
          
          rm -rf "${TEMP_DIR}"
          echo "Successfully prepared latest universal binaries!"

      - name: Build Application 🔧
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          CURRENT_BUILD=$(python3 -c "import json; print(json.load(open('website/public/appcast.json')).get('build', 1))")
          NEXT_BUILD=$((CURRENT_BUILD + 1))
          echo "Compiling v${VERSION} with Build #${NEXT_BUILD}..."
          
          chmod +x ./build.sh
          ./build.sh "${VERSION}" "${NEXT_BUILD}"

      - name: Package DMG 📦
        id: package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DMG_NAME="MacHead-${TAG_NAME}-macos-universal.dmg"
          echo "Packaging DMG: ${DMG_NAME}..."
          
          # 创建临时包装文件夹，包含 App 实体以及指向系统 Applications 目录的软链接
          mkdir -p dist-dmg
          cp -R "MacHead.app" dist-dmg/
          ln -s /Applications dist-dmg/Applications
          
          # 将打包目录整体打包生成为 DMG 映像磁盘，Finder 挂载后会呈现出 App + 文件夹的双栏拖拽快捷安装界面
          hdiutil create -fs HFS+ -srcfolder dist-dmg -volname "MacHead" "${DMG_NAME}"
          
          echo "dmg_name=${DMG_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload DMG to Cloudflare R2 🚀
        run: |
          npm install -g wrangler
          wrangler r2 object put "headlessmac-releases/${{ steps.package.outputs.dmg_name }}" --file="${{ steps.package.outputs.dmg_name }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update appcast.json (User Release Notes) 📝
        id: appcast
        run: |
          TAG_NAME="${{ steps.package.outputs.tag_name }}"
          
          # 拉取所有远程标签，确保 git describe 能够正确计算上个版本号
          git fetch origin --tags --force || true
          
          # 检查标签类型 (tag 代表附注标签，commit 代表轻量标签)
          TAG_TYPE=$(git cat-file -t "$TAG_NAME" 2>/dev/null || echo "commit")
          
          if [ "$TAG_TYPE" = "tag" ]; then
            # 1. 附注标签：提取标签中的描述文字作为日志
            USER_NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME" | xargs)
          else
            # 2. 轻量标签：清空以触发下方的 Commit 日志自动抓取
            USER_NOTES=""
          fi
          
          # 3. 如果描述为空（或是轻量标签），则自动拉取上个 Tag 到当前 Tag 之间的所有 commit messages 作为日志
          if [ -z "$USER_NOTES" ]; then
            echo "No annotated tag message found. Auto-generating from git logs..."
            # 找到上一个 Tag 的名字
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="${PREV_TAG}..${TAG_NAME}"
            else
              COMMIT_RANGE="${TAG_NAME}"
            fi
            
            # 获取范围内的 commit 消息，排除掉 chore 提交、合并提交和 CI 跳过提交
            USER_NOTES=$(git log "${COMMIT_RANGE}" --pretty=format:"1. %s" | \
              grep -viE "chore\(release\)|Merge pull request|Merge branch|\[skip ci\]" | \
              awk '{print NR ". " substr($0, 4)}' | \
              paste -sd "\n" - || echo "1. 优化了系统运行效率，修复了部分已知问题。")
          fi
          
          echo "Final release notes to be written:"
          echo "${USER_NOTES}"
          
          PUB_DATE=$(date +%Y-%m-%d)
          
          # 将提取的信息传递给 Python 脚本进行安全的 JSON 重写
          export TAG_NAME USER_NOTES PUB_DATE
          python3 -c "
          import json
          import os
          
          tag = os.environ['TAG_NAME']
          version = tag.lstrip('v')
          notes = os.environ['USER_NOTES']
          pub_date = os.environ['PUB_DATE']
          
          appcast_path = 'website/public/appcast.json'
          with open(appcast_path, 'r') as f:
              data = json.load(f)
              
          current_build = int(data.get('build', 1))
          
          data['version'] = version
          data['build'] = current_build + 1
          data['pubDate'] = pub_date
          data['url'] = f'https://releases.headlessmac.com/MacHead-{tag}-macos-universal.dmg'
          data['releaseNotes'] = notes
          
          with open(appcast_path, 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "
          echo "Successfully updated appcast.json"

      - name: Commit and Push appcast.json 💾
        run: |
          TAG_NAME="${{ steps.package.outputs.tag_name }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/appcast.json
          git commit -m "chore(release): update appcast.json for ${TAG_NAME}"
          git push origin HEAD:main

      - name: Create GitHub Release (Technical Release Notes) 🎁
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.dmg_name }}
          generate_release_notes: true # 自动根据 commit 历史生成 Technical 技术日志
          body: |
            ## MacHead ${{ steps.package.outputs.tag_name }}
            
            技术变更细节请查看下方自动生成的提交日志。
            User-facing release notes are served via OTA update channel.
