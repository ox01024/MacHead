name: Build and Release OTA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史以生成 Technical Release Notes

      - name: Build Application 🔧
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          CURRENT_BUILD=$(python3 -c "import json; print(json.load(open('website/public/appcast.json')).get('build', 1))")
          NEXT_BUILD=$((CURRENT_BUILD + 1))
          echo "Compiling v${VERSION} with Build #${NEXT_BUILD}..."
          
          chmod +x ./build.sh
          ./build.sh "${VERSION}" "${NEXT_BUILD}"

      - name: Package DMG 📦
        id: package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DMG_NAME="MacHead-${TAG_NAME}-macos-universal.dmg"
          echo "Packaging DMG: ${DMG_NAME}..."
          
          # 创建临时包装文件夹，包含 App 实体以及指向系统 Applications 目录的软链接
          mkdir -p dist-dmg
          cp -R "MacHead.app" dist-dmg/
          ln -s /Applications dist-dmg/Applications
          
          # 将打包目录整体打包生成为 DMG 映像磁盘，Finder 挂载后会呈现出 App + 文件夹的双栏拖拽快捷安装界面
          hdiutil create -fs HFS+ -srcfolder dist-dmg -volname "MacHead" "${DMG_NAME}"
          
          echo "dmg_name=${DMG_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload DMG to Cloudflare R2 🚀
        run: |
          npm install -g wrangler
          wrangler r2 object put "headlessmac-releases/${{ steps.package.outputs.dmg_name }}" --file="${{ steps.package.outputs.dmg_name }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update appcast.json (User Release Notes) 📝
        id: appcast
        run: |
          TAG_NAME="${{ steps.package.outputs.tag_name }}"
          
          # 强制从远程获取完整的附注标签对象，防止 actions/checkout 只拉取 commit 导致日志被替换为 commit message
          git fetch origin refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME} --force
          
          # 提取 Git Tag 描述作为用户升级日志 (User-facing Notes)
          USER_NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME")
          if [ -z "$USER_NOTES" ]; then
            USER_NOTES="优化了系统运行效率，修复了部分已知问题。"
          fi
          
          PUB_DATE=$(date +%Y-%m-%d)
          
          # 将提取的信息传递给 Python 脚本进行安全的 JSON 重写
          export TAG_NAME USER_NOTES PUB_DATE
          python3 -c "
          import json
          import os
          
          tag = os.environ['TAG_NAME']
          version = tag.lstrip('v')
          notes = os.environ['USER_NOTES']
          pub_date = os.environ['PUB_DATE']
          
          appcast_path = 'website/public/appcast.json'
          with open(appcast_path, 'r') as f:
              data = json.load(f)
              
          current_build = int(data.get('build', 1))
          
          data['version'] = version
          data['build'] = current_build + 1
          data['pubDate'] = pub_date
          data['url'] = f'https://releases.headlessmac.com/MacHead-{tag}-macos-universal.dmg'
          data['releaseNotes'] = notes
          
          with open(appcast_path, 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "
          echo "Successfully updated appcast.json"

      - name: Commit and Push appcast.json 💾
        run: |
          TAG_NAME="${{ steps.package.outputs.tag_name }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/appcast.json
          git commit -m "chore(release): update appcast.json for ${TAG_NAME}"
          git push origin HEAD:main

      - name: Create GitHub Release (Technical Release Notes) 🎁
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.dmg_name }}
          generate_release_notes: true # 自动根据 commit 历史生成 Technical 技术日志
          body: |
            ## MacHead ${{ steps.package.outputs.tag_name }}
            
            技术变更细节请查看下方自动生成的提交日志。
            User-facing release notes are served via OTA update channel.
